name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure Android SDK 34 & 35 are installed
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.family.medcard FamilyMed
          cd myapp
          cordova platform add android

      - name: Enable largeHeap in AndroidManifest.xml
        run: |
          MANIFEST="myapp/platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application /<application android:largeHeap="true" /g' "$MANIFEST"
          fi

      - name: Inject Native Android File, Chunked Video Stream, PDF & Share Bridge into MainActivity.java
        run: |
          cat << 'EOF' > myapp/platforms/android/app/src/main/java/com/family/medcard/MainActivity.java
          package com.family.medcard;

          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.WebView;
          import android.webkit.JavascriptInterface;
          import android.content.Intent;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.StrictMode;
          import android.provider.MediaStore;
          import java.io.OutputStream;
          import java.io.InputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.BufferedOutputStream;
          import java.nio.charset.StandardCharsets;
          import org.apache.cordova.*;

          public class MainActivity extends CordovaActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  StrictMode.VmPolicy.Builder builder = new StrictMode.VmPolicy.Builder();
                  StrictMode.setVmPolicy(builder.build());

                  Bundle extras = getIntent().getExtras();
                  if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {
                      moveTaskToBack(true);
                  }
                  loadUrl(launchUrl);
                  try {
                      WebView webView = (WebView) this.appView.getView();
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setAllowFileAccess(true);
                      webView.getSettings().setAllowContentAccess(true);
                      webView.getSettings().setAllowFileAccessFromFileURLs(true);
                      webView.getSettings().setAllowUniversalAccessFromFileURLs(true);
                      webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      webView.getSettings().setDomStorageEnabled(true);
                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidNative");
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public class WebAppInterface {
                  private File currentStreamingFile = null;
                  private BufferedOutputStream currentStreamOut = null;

                  private File getAppMediaDir() {
                      File dir = new File(getExternalFilesDir(null), "MedMedia");
                      if (!dir.exists()) dir.mkdirs();
                      return dir;
                  }

                  private byte[] decodeBase64Data(String base64Data) {
                      if (base64Data == null || base64Data.isEmpty()) return new byte[0];
                      String pure = base64Data;
                      int comma = base64Data.indexOf(',');
                      if (comma != -1) {
                          pure = base64Data.substring(comma + 1);
                      }
                      return Base64.decode(pure, Base64.DEFAULT);
                  }

                  private Uri writeBytesToDownloads(String fileName, byte[] dataBytes, String mimeType) throws Exception {
                      if (dataBytes == null || dataBytes.length == 0) {
                          throw new Exception("Файл порожній (0 байт)");
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              OutputStream out = getContentResolver().openOutputStream(uri);
                              if (out != null) {
                                  out.write(dataBytes);
                                  out.flush();
                                  out.close();
                              }
                              ContentValues updateValues = new ContentValues();
                              updateValues.put(MediaStore.MediaColumns.IS_PENDING, 0);
                              getContentResolver().update(uri, updateValues, null, null);
                              return uri;
                          }
                      }
                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dir.exists()) dir.mkdirs();
                      File file = new File(dir, fileName);
                      FileOutputStream fos = new FileOutputStream(file);
                      fos.write(dataBytes);
                      fos.flush();
                      fos.close();
                      return Uri.fromFile(file);
                  }

                  private Uri copyFileToDownloads(File sourceFile, String fileName, String mimeType) throws Exception {
                      if (sourceFile == null || !sourceFile.exists() || sourceFile.length() == 0) {
                          throw new Exception("Вихідний медіафайл не знайдено або він порожній");
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              InputStream in = new FileInputStream(sourceFile);
                              OutputStream out = getContentResolver().openOutputStream(uri);
                              if (out != null) {
                                  byte[] buf = new byte[65536];
                                  int len;
                                  while ((len = in.read(buf)) > 0) {
                                      out.write(buf, 0, len);
                                  }
                                  out.flush();
                                  out.close();
                              }
                              in.close();
                              ContentValues updateValues = new ContentValues();
                              updateValues.put(MediaStore.MediaColumns.IS_PENDING, 0);
                              getContentResolver().update(uri, updateValues, null, null);
                              return uri;
                          }
                      }
                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dir.exists()) dir.mkdirs();
                      File destFile = new File(dir, fileName);
                      InputStream in = new FileInputStream(sourceFile);
                      FileOutputStream fos = new FileOutputStream(destFile);
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) > 0) {
                          fos.write(buf, 0, len);
                      }
                      fos.flush();
                      fos.close();
                      in.close();
                      return Uri.fromFile(destFile);
                  }

                  /* --- CHUNKED STREAMING API FOR LARGE VIDEOS & FILES (250MB+) --- */
                  @JavascriptInterface
                  public String startChunkedMedia(String fileName) {
                      try {
                          if (currentStreamOut != null) {
                              try { currentStreamOut.close(); } catch (Exception ignored) {}
                          }
                          String safeName = System.currentTimeMillis() + "_" + fileName.replaceAll("[^a-zA-Z0-9._-]", "_");
                          currentStreamingFile = new File(getAppMediaDir(), safeName);
                          currentStreamOut = new BufferedOutputStream(new FileOutputStream(currentStreamingFile), 65536);
                          return "OK";
                      } catch (Throwable t) {
                          return "ERR:" + t.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String appendChunkedMedia(String base64Chunk) {
                      try {
                          if (currentStreamOut == null) return "ERR:Stream not started";
                          byte[] chunkBytes = decodeBase64Data(base64Chunk);
                          if (chunkBytes.length > 0) {
                              currentStreamOut.write(chunkBytes);
                          }
                          return "OK";
                      } catch (Throwable t) {
                          return "ERR:" + t.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String finishChunkedMedia() {
                      try {
                          if (currentStreamOut != null) {
                              currentStreamOut.flush();
                              currentStreamOut.close();
                              currentStreamOut = null;
                          }
                          if (currentStreamingFile != null && currentStreamingFile.exists() && currentStreamingFile.length() > 0) {
                              return currentStreamingFile.getAbsolutePath();
                          }
                          return "ERR:Empty file after stream";
                      } catch (Throwable t) {
                          return "ERR:" + t.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String saveNativeFileToDownloads(String nativePath, String fileName, String mimeType) {
                      try {
                          File src = new File(nativePath);
                          copyFileToDownloads(src, fileName, mimeType);
                          return "OK";
                      } catch (Throwable t) {
                          return "ERR:" + t.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String openNativeFile(String nativePath, String fileName, String mimeType) {
                      try {
                          File src = new File(nativePath);
                          Uri uri = copyFileToDownloads(src, fileName, mimeType);
                          Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                          viewIntent.setDataAndType(uri, mimeType);
                          viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          viewIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          Intent chooser = Intent.createChooser(viewIntent, "Відкрити у додатку / плеєрі");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Throwable t) {
                          return "ERR:" + t.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String shareNativeFile(String nativePath, String fileName, String mimeType, String title) {
                      try {
                          File src = new File(nativePath);
                          Uri uri = copyFileToDownloads(src, fileName, mimeType);
                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                          shareIntent.setType(mimeType);
                          shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                          shareIntent.putExtra(Intent.EXTRA_SUBJECT, title);
                          shareIntent.putExtra(Intent.EXTRA_TEXT, title);
                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          Intent chooser = Intent.createChooser(shareIntent, "Поділитися файлом");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Throwable t) {
                          return "ERR:" + t.getMessage();
                      }
                  }

                  /* --- STANDARD API FOR BACKUPS & SMALL FILES --- */
                  @JavascriptInterface
                  public String saveBackupToPhone(String fileName, String content) {
                      try {
                          writeBytesToDownloads(fileName, content.getBytes(StandardCharsets.UTF_8), "application/json");
                          return "OK";
                      } catch (Throwable e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String shareBackupFile(String fileName, String content) {
                      try {
                          Uri uri = writeBytesToDownloads(fileName, content.getBytes(StandardCharsets.UTF_8), "application/json");
                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                          shareIntent.setType("application/json");
                          shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                          shareIntent.putExtra(Intent.EXTRA_SUBJECT, fileName);
                          shareIntent.putExtra(Intent.EXTRA_TEXT, "Резервна копія Сімейна Медкартка PRO (" + fileName + ")");
                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          Intent chooser = Intent.createChooser(shareIntent, "Зберегти на Google Диск або переслати");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Throwable e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String saveBinaryFile(String fileName, String base64Data, String mimeType) {
                      try {
                          byte[] bytes = decodeBase64Data(base64Data);
                          writeBytesToDownloads(fileName, bytes, mimeType);
                          return "OK";
                      } catch (Throwable e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String openBinaryFile(String fileName, String base64Data, String mimeType) {
                      try {
                          byte[] bytes = decodeBase64Data(base64Data);
                          Uri uri = writeBytesToDownloads(fileName, bytes, mimeType);
                          Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                          viewIntent.setDataAndType(uri, mimeType);
                          viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          viewIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          Intent chooser = Intent.createChooser(viewIntent, "Відкрити файл у додатку");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Throwable e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String shareBinaryFile(String fileName, String base64Data, String mimeType, String title) {
                      try {
                          byte[] bytes = decodeBase64Data(base64Data);
                          Uri uri = writeBytesToDownloads(fileName, bytes, mimeType);
                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                          shareIntent.setType(mimeType);
                          shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                          shareIntent.putExtra(Intent.EXTRA_SUBJECT, title);
                          shareIntent.putExtra(Intent.EXTRA_TEXT, title);
                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          Intent chooser = Intent.createChooser(shareIntent, "Поділитися файлом");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Throwable e) {
                          return "ERR:" + e.getMessage();
                      }
                  }
              }
          }
          EOF

      - name: Create Medical App Icon & Set App Name
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -size 512x512 xc:"#0284c7" -fill "#ffffff" -draw "rectangle 206,96 306,416" -draw "rectangle 96,206 416,306" myapp/icon.png
          sed -i 's|<name>FamilyMed</name>|<name>Медкартка PRO</name>|g' myapp/config.xml
          sed -i 's|</widget>|  <icon src="icon.png" />\n</widget>|g' myapp/config.xml

      - name: Copy index.html
        run: |
          rm -rf myapp/www/*
          cp index.html myapp/www/

      - name: Build Android APK (Debug)
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMed-PRO-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
