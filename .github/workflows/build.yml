name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure Android SDK 34 & 35 are installed
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.family.medcard FamilyMed
          cd myapp
          cordova platform add android

      - name: Configure Android Permissions & Large Heap in AndroidManifest.xml
        run: |
          MANIFEST="myapp/platforms/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<application android:largeHeap="true" android:usesCleartextTraffic="true"|g' "$MANIFEST"
          sed -i 's|</manifest>|  <uses-permission android:name="android.permission.RECORD_AUDIO" />\n  <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n  <uses-permission android:name="android.permission.VIBRATE" />\n  <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>|g' "$MANIFEST"

      - name: Inject Native Large-Video Streaming, Audio Permissions, Alarm & File Bridge into MainActivity.java
        run: |
          cat << 'EOF' > myapp/platforms/android/app/src/main/java/com/family/medcard/MainActivity.java
          package com.family.medcard;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.StrictMode;
          import android.provider.AlarmClock;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import org.apache.cordova.*;
          import org.json.JSONObject;

          public class MainActivity extends CordovaActivity {
              private static final int PICK_NATIVE_MEDIA_CODE = 9001;
              private String pendingPickerTargetContainer = "";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  StrictMode.VmPolicy.Builder builder = new StrictMode.VmPolicy.Builder();
                  StrictMode.setVmPolicy(builder.build());

                  Bundle extras = getIntent().getExtras();
                  if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {
                      moveTaskToBack(true);
                  }
                  loadUrl(launchUrl);

                  try {
                      WebView webView = (WebView) this.appView.getView();
                      WebSettings ws = webView.getSettings();
                      ws.setJavaScriptEnabled(true);
                      ws.setAllowFileAccess(true);
                      ws.setAllowContentAccess(true);
                      ws.setAllowFileAccessFromFileURLs(true);
                      ws.setAllowUniversalAccessFromFileURLs(true);
                      ws.setDomStorageEnabled(true);
                      ws.setMediaPlaybackRequiresUserGesture(false);

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });

                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidNative");
                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      }
                  }
              }

              private String getFileNameFromUri(Uri uri) {
                  String result = null;
                  if ("content".equals(uri.getScheme())) {
                      try (Cursor cursor = getContentResolver().query(uri, null, null, null, null)) {
                          if (cursor != null && cursor.moveToFirst()) {
                              int idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                              if (idx >= 0) result = cursor.getString(idx);
                          }
                      } catch (Exception ignored) {}
                  }
                  if (result == null) {
                      result = uri.getPath();
                      int cut = result != null ? result.lastIndexOf('/') : -1;
                      if (cut != -1) result = result.substring(cut + 1);
                  }
                  return result != null ? result : "Media_" + System.currentTimeMillis();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  if (requestCode == PICK_NATIVE_MEDIA_CODE) {
                      if (resultCode == Activity.RESULT_OK && intent != null && intent.getData() != null) {
                          final Uri sourceUri = intent.getData();
                          final String targetContainer = pendingPickerTargetContainer;
                          new Thread(() -> {
                              try {
                                  String origName = getFileNameFromUri(sourceUri);
                                  String mime = getContentResolver().getType(sourceUri);
                                  if (mime == null) {
                                      String low = origName.toLowerCase();
                                      if (low.endsWith(".pdf")) mime = "application/pdf";
                                      else if (low.endsWith(".mp4") || low.endsWith(".mov") || low.endsWith(".mkv")) mime = "video/mp4";
                                      else mime = "video/mp4";
                                  }

                                  File mediaDir = new File(getExternalFilesDir(null), "med_media");
                                  if (!mediaDir.exists()) mediaDir.mkdirs();

                                  String safeName = System.currentTimeMillis() + "_" + origName.replaceAll("[^a-zA-Z0-9._\\-]", "_");
                                  File destFile = new File(mediaDir, safeName);

                                  try (InputStream in = getContentResolver().openInputStream(sourceUri);
                                       OutputStream out = new FileOutputStream(destFile)) {
                                      byte[] buf = new byte[65536];
                                      int len;
                                      while ((len = in.read(buf)) > 0) {
                                          out.write(buf, 0, len);
                                      }
                                      out.flush();
                                  }

                                  String fType = "video";
                                  if (mime.contains("pdf")) fType = "pdf";
                                  else if (mime.startsWith("image")) fType = "image";

                                  JSONObject res = new JSONObject();
                                  res.put("type", fType);
                                  res.put("mime", mime);
                                  res.put("title", origName);
                                  res.put("nativePath", destFile.getAbsolutePath());
                                  res.put("fileUri", Uri.fromFile(destFile).toString());
                                  res.put("sizeMB", String.format("%.1f МБ", destFile.length() / (1024.0 * 1024.0)));
                                  res.put("containerId", targetContainer);

                                  final String jsPayload = res.toString();
                                  runOnUiThread(() -> {
                                      try {
                                          WebView wv = (WebView) appView.getView();
                                          wv.evaluateJavascript("window.onNativeMediaPicked(" + jsPayload + ");", null);
                                      } catch (Exception ignored) {}
                                  });
                              } catch (Exception e) {
                                  final String errMsg = e.getMessage();
                                  runOnUiThread(() -> {
                                      try {
                                          WebView wv = (WebView) appView.getView();
                                          wv.evaluateJavascript("showToast('Помилка імпорту файлу: " + errMsg + "', 'danger');", null);
                                      } catch (Exception ignored) {}
                                  });
                              }
                          }).start();
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, intent);
              }

              public class WebAppInterface {
                  private void copyStream(InputStream in, OutputStream out) throws Exception {
                      byte[] buffer = new byte[65536];
                      int read;
                      while ((read = in.read(buffer)) != -1) {
                          out.write(buffer, 0, read);
                      }
                      out.flush();
                  }

                  private Uri writeFileOrBytesToDownloads(String fileName, File sourceFile, byte[] dataBytes, String mimeType) throws Exception {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                                  if (out != null) {
                                      if (sourceFile != null) {
                                          try (InputStream in = new FileInputStream(sourceFile)) {
                                              copyStream(in, out);
                                          }
                                      } else if (dataBytes != null) {
                                          out.write(dataBytes);
                                          out.flush();
                                      }
                                  }
                              }
                              return uri;
                          }
                      }
                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dir.exists()) dir.mkdirs();
                      File file = new File(dir, fileName);
                      try (FileOutputStream fos = new FileOutputStream(file)) {
                          if (sourceFile != null) {
                              try (InputStream in = new FileInputStream(sourceFile)) {
                                  copyStream(in, fos);
                              }
                          } else if (dataBytes != null) {
                              fos.write(dataBytes);
                              fos.flush();
                          }
                      }
                      return Uri.fromFile(file);
                  }

                  private Uri writeBytesToTempCache(String fileName, byte[] dataBytes) throws Exception {
                      File cacheDir = new File(getExternalCacheDir(), "shared_temp");
                      if (!cacheDir.exists()) cacheDir.mkdirs();
                      File file = new File(cacheDir, fileName);
                      try (FileOutputStream fos = new FileOutputStream(file)) {
                          fos.write(dataBytes);
                          fos.flush();
                      }
                      return Uri.fromFile(file);
                  }

                  private byte[] decodeBase64Data(String base64Data) {
                      String pure = base64Data;
                      int comma = base64Data.indexOf(',');
                      if (comma != -1) {
                          pure = base64Data.substring(comma + 1);
                      }
                      return Base64.decode(pure, Base64.DEFAULT);
                  }

                  @JavascriptInterface
                  public void pickNativeMediaFile(String containerId, String mimeFilter) {
                      pendingPickerTargetContainer = containerId;
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType(mimeFilter != null && !mimeFilter.isEmpty() ? mimeFilter : "*/*");
                      if ("video/*".equals(mimeFilter)) {
                          intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"video/*", "application/pdf", "image/*"});
                      }
                      cordova.setActivityResultCallback(MainActivity.this);
                      startActivityForResult(intent, PICK_NATIVE_MEDIA_CODE);
                  }

                  @JavascriptInterface
                  public String openLocalPathFile(String nativePath, String mimeType) {
                      try {
                          File f = new File(nativePath);
                          if (!f.exists()) return "ERR:Файл не знайдено на пристрої";
                          Uri uri = Uri.fromFile(f);
                          Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                          viewIntent.setDataAndType(uri, mimeType);
                          viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          Intent chooser = Intent.createChooser(viewIntent, "Відкрити у плеєрі / додатку");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String shareLocalPathFile(String nativePath, String mimeType, String title) {
                      try {
                          File f = new File(nativePath);
                          if (!f.exists()) return "ERR:Файл не знайдено";
                          Uri uri = Uri.fromFile(f);
                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                          shareIntent.setType(mimeType);
                          shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                          shareIntent.putExtra(Intent.EXTRA_SUBJECT, title);
                          shareIntent.putExtra(Intent.EXTRA_TEXT, title);
                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          Intent chooser = Intent.createChooser(shareIntent, "Поділитися файлом");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String saveLocalPathFileToDownloads(String nativePath, String fileName, String mimeType) {
                      try {
                          File f = new File(nativePath);
                          if (!f.exists()) return "ERR:Вихідний файл не знайдено";
                          writeFileOrBytesToDownloads(fileName, f, null, mimeType);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String setSystemAlarm(int hour, int minute, String message) {
                      try {
                          Intent intent = new Intent(AlarmClock.ACTION_SET_ALARM);
                          intent.putExtra(AlarmClock.EXTRA_HOUR, hour);
                          intent.putExtra(AlarmClock.EXTRA_MINUTES, minute);
                          intent.putExtra(AlarmClock.EXTRA_MESSAGE, message);
                          intent.putExtra(AlarmClock.EXTRA_SKIP_UI, false);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String saveBackupToPhone(String fileName, String content) {
                      try {
                          String mime = fileName.endsWith(".html") ? "text/html" : (fileName.endsWith(".txt") ? "text/plain" : "application/json");
                          writeFileOrBytesToDownloads(fileName, null, content.getBytes(StandardCharsets.UTF_8), mime);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String shareBackupFile(String fileName, String content) {
                      try {
                          String mime = fileName.endsWith(".html") ? "text/html" : (fileName.endsWith(".txt") ? "text/plain" : "application/json");
                          Uri uri = writeBytesToTempCache(fileName, content.getBytes(StandardCharsets.UTF_8));
                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                          shareIntent.setType(mime);
                          shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                          shareIntent.putExtra(Intent.EXTRA_SUBJECT, fileName);
                          shareIntent.putExtra(Intent.EXTRA_TEXT, "Сімейна Медкартка PRO (" + fileName + ")");
                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          Intent chooser = Intent.createChooser(shareIntent, "Зберегти на Google Диск або переслати");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String saveBinaryFile(String fileName, String base64Data, String mimeType) {
                      try {
                          byte[] bytes = decodeBase64Data(base64Data);
                          writeFileOrBytesToDownloads(fileName, null, bytes, mimeType);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String openBinaryFile(String fileName, String base64Data, String mimeType) {
                      try {
                          byte[] bytes = decodeBase64Data(base64Data);
                          Uri uri = writeBytesToTempCache(fileName, bytes);
                          Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                          viewIntent.setDataAndType(uri, mimeType);
                          viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          Intent chooser = Intent.createChooser(viewIntent, "Відкрити файл у додатку");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String shareBinaryFile(String fileName, String base64Data, String mimeType, String title) {
                      try {
                          byte[] bytes = decodeBase64Data(base64Data);
                          Uri uri = writeBytesToTempCache(fileName, bytes);
                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                          shareIntent.setType(mimeType);
                          shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                          shareIntent.putExtra(Intent.EXTRA_SUBJECT, title);
                          shareIntent.putExtra(Intent.EXTRA_TEXT, title);
                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          Intent chooser = Intent.createChooser(shareIntent, "Поділитися файлом");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }
              }
          }
          EOF

      - name: Create Medical App Icon & Set App Name
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick curl
          convert -size 512x512 xc:"#0284c7" -fill "#ffffff" -draw "rectangle 206,96 306,416" -draw "rectangle 96,206 416,306" myapp/icon.png
          sed -i 's|<name>FamilyMed</name>|<name>Медкартка PRO</name>|g' myapp/config.xml
          sed -i 's|</widget>|  <icon src="icon.png" />\n</widget>|g' myapp/config.xml

      - name: Copy index.html & Bundle Offline PDF.js Library
        run: |
          rm -rf myapp/www/*
          cp index.html myapp/www/
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js -o myapp/www/pdf.min.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js -o myapp/www/pdf.worker.min.js

      - name: Build Android APK (Debug)
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMed-PRO-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
