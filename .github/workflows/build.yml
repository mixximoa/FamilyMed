name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure Android SDK 34 & 35 are installed
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.family.medcard FamilyMed
          cd myapp
          cordova platform add android

      - name: Inject Permissions into AndroidManifest.xml
        run: |
          MANIFEST="myapp/platforms/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n    <application|g' "$MANIFEST"

      - name: Inject Chunked Streaming & Content-URI Bridge into MainActivity.java
        run: |
          cat << 'EOF' > myapp/platforms/android/app/src/main/java/com/family/medcard/MainActivity.java
          package com.family.medcard;

          import android.Manifest;
          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.StrictMode;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.provider.AlarmClock;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import org.apache.cordova.*;

          public class MainActivity extends CordovaActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  StrictMode.VmPolicy.Builder builder = new StrictMode.VmPolicy.Builder();
                  StrictMode.setVmPolicy(builder.build());

                  Bundle extras = getIntent().getExtras();
                  if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {
                      moveTaskToBack(true);
                  }
                  loadUrl(launchUrl);
                  try {
                      WebView webView = (WebView) this.appView.getView();
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setAllowFileAccess(true);
                      webView.getSettings().setDomStorageEnabled(true);
                      webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidNative");

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public class WebAppInterface {
                  private File currentStreamingFile = null;
                  private FileOutputStream currentStreamingFos = null;

                  // Створює або перезаписує файл у MediaStore, повертаючи 100% валідний content:// URI для всіх додатків Android
                  private Uri exportFileToMediaStore(File sourceFile, String displayFileName, String mimeType, boolean isPermanentDownload) throws Exception {
                      ContentResolver resolver = getContentResolver();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          String subFolder = isPermanentDownload ? Environment.DIRECTORY_DOWNLOADS : (Environment.DIRECTORY_DOWNLOADS + "/FamilyMed_Shared");
                          // Видаляємо попередню копію з таким самим ім'ям, щоб не плодити дублікати (1), (2) і уникати помилок
                          try {
                              String selection = MediaStore.Downloads.DISPLAY_NAME + "=?";
                              String[] selectionArgs = new String[]{ displayFileName };
                              resolver.delete(MediaStore.Downloads.EXTERNAL_CONTENT_URI, selection, selectionArgs);
                          } catch (Exception ignored) {}

                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, displayFileName);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, subFolder);
                          values.put(MediaStore.Downloads.IS_PENDING, 1);

                          Uri collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                          Uri itemUri = resolver.insert(collection, values);
                          if (itemUri != null) {
                              try (OutputStream out = resolver.openOutputStream(itemUri);
                                   FileInputStream in = new FileInputStream(sourceFile)) {
                                  byte[] buf = new byte[65536];
                                  int len;
                                  while ((len = in.read(buf)) > 0) {
                                      out.write(buf, 0, len);
                                  }
                                  out.flush();
                              }
                              ContentValues updateValues = new ContentValues();
                              updateValues.put(MediaStore.Downloads.IS_PENDING, 0);
                              resolver.update(itemUri, updateValues, null, null);
                              return itemUri;
                          }
                      }

                      // Fallback для старіших Android (< 10)
                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dir.exists()) dir.mkdirs();
                      File destFile = new File(dir, displayFileName);
                      if (destFile.exists()) destFile.delete();
                      try (FileOutputStream out = new FileOutputStream(destFile);
                           FileInputStream in = new FileInputStream(sourceFile)) {
                          byte[] buf = new byte[65536];
                          int len;
                          while ((len = in.read(buf)) > 0) {
                              out.write(buf, 0, len);
                          }
                          out.flush();
                      }
                      return Uri.fromFile(destFile);
                  }

                  private void closeCurrentStreamQuietly() {
                      try {
                          if (currentStreamingFos != null) {
                              currentStreamingFos.flush();
                              currentStreamingFos.close();
                          }
                      } catch (Exception ignored) {}
                      currentStreamingFos = null;
                  }

                  // 1. Початок потокової передачі (безпечно для великих Відео та PDF)
                  @JavascriptInterface
                  public String startFileStream(String fileName) {
                      try {
                          closeCurrentStreamQuietly();
                          File cacheDir = getExternalCacheDir();
                          if (cacheDir == null) cacheDir = getCacheDir();
                          if (!cacheDir.exists()) cacheDir.mkdirs();
                          currentStreamingFile = new File(cacheDir, "stream_temp.bin");
                          if (currentStreamingFile.exists()) currentStreamingFile.delete();
                          currentStreamingFos = new FileOutputStream(currentStreamingFile, true);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  // 2. Додавання порції Base64 (по ~512 КБ за раз, без OutOfMemoryError)
                  @JavascriptInterface
                  public String appendFileChunk(String base64Chunk) {
                      try {
                          if (currentStreamingFos == null) return "ERR:Stream not started";
                          byte[] decoded = Base64.decode(base64Chunk, Base64.DEFAULT);
                          currentStreamingFos.write(decoded);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  // 3. Завершення передачі та виконання дії: open / share / download
                  @JavascriptInterface
                  public String finishFileStream(String fileName, String mimeType, String actionType, String title) {
                      try {
                          closeCurrentStreamQuietly();
                          if (currentStreamingFile == null || !currentStreamingFile.exists()) {
                              return "ERR:Temp file missing";
                          }
                          boolean isDownload = "download".equalsIgnoreCase(actionType);
                          Uri contentUri = exportFileToMediaStore(currentStreamingFile, fileName, mimeType, isDownload);
                          currentStreamingFile.delete();

                          if (isDownload) {
                              return "OK";
                          } else if ("open".equalsIgnoreCase(actionType)) {
                              Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                              viewIntent.setDataAndType(contentUri, mimeType);
                              viewIntent.setClipData(ClipData.newRawUri(fileName, contentUri));
                              viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                              Intent chooser = Intent.createChooser(viewIntent, "Відкрити файл у додатку");
                              chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(chooser);
                              return "OK";
                          } else if ("share".equalsIgnoreCase(actionType)) {
                              Intent shareIntent = new Intent(Intent.ACTION_SEND);
                              shareIntent.setType(mimeType);
                              shareIntent.putExtra(Intent.EXTRA_STREAM, contentUri);
                              shareIntent.putExtra(Intent.EXTRA_SUBJECT, title != null ? title : fileName);
                              shareIntent.putExtra(Intent.EXTRA_TEXT, title != null ? title : fileName);
                              shareIntent.setClipData(ClipData.newRawUri(fileName, contentUri));
                              shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              Intent chooser = Intent.createChooser(shareIntent, "Поділитися файлом");
                              chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(chooser);
                              return "OK";
                          }
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String requestMicPermission() {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                                  return "REQUESTED";
                              }
                          }
                          return "GRANTED";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String setSystemAlarm(int hour, int minute, String message) {
                      try {
                          Intent intent = new Intent(AlarmClock.ACTION_SET_ALARM);
                          intent.putExtra(AlarmClock.EXTRA_HOUR, hour);
                          intent.putExtra(AlarmClock.EXTRA_MINUTES, minute);
                          intent.putExtra(AlarmClock.EXTRA_MESSAGE, message);
                          intent.putExtra(AlarmClock.EXTRA_SKIP_UI, false);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String printCurrentPage(String jobName) {
                      try {
                          runOnUiThread(() -> {
                              try {
                                  WebView webView = (WebView) appView.getView();
                                  PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                  PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter(jobName);
                                  printManager.print(jobName, adapter, new PrintAttributes.Builder().build());
                              } catch (Exception ex) {
                                  ex.printStackTrace();
                              }
                          });
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String saveBackupToPhone(String fileName, String content) {
                      try {
                          File cacheDir = getExternalCacheDir();
                          if (cacheDir == null) cacheDir = getCacheDir();
                          File temp = new File(cacheDir, "backup_temp.json");
                          try (FileOutputStream fos = new FileOutputStream(temp)) {
                              fos.write(content.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          exportFileToMediaStore(temp, fileName, "application/json", true);
                          temp.delete();
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String shareBackupFile(String fileName, String content) {
                      try {
                          String mime = fileName.endsWith(".html") ? "text/html" : (fileName.endsWith(".txt") ? "text/plain" : "application/json");
                          File cacheDir = getExternalCacheDir();
                          if (cacheDir == null) cacheDir = getCacheDir();
                          File temp = new File(cacheDir, "share_temp.dat");
                          try (FileOutputStream fos = new FileOutputStream(temp)) {
                              fos.write(content.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          Uri uri = exportFileToMediaStore(temp, fileName, mime, false);
                          temp.delete();

                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                          shareIntent.setType(mime);
                          shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                          shareIntent.putExtra(Intent.EXTRA_SUBJECT, fileName);
                          shareIntent.putExtra(Intent.EXTRA_TEXT, "Сімейна Медкартка PRO (" + fileName + ")");
                          shareIntent.setClipData(ClipData.newRawUri(fileName, uri));
                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          Intent chooser = Intent.createChooser(shareIntent, "Зберегти або переслати файл");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }
              }
          }
          EOF

      - name: Create Medical App Icon & Set App Name
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick curl
          convert -size 512x512 xc:"#0284c7" -fill "#ffffff" -draw "rectangle 206,96 306,416" -draw "rectangle 96,206 416,306" myapp/icon.png
          sed -i 's|<name>FamilyMed</name>|<name>Медкартка PRO</name>|g' myapp/config.xml
          sed -i 's|</widget>|  <icon src="icon.png" />\n</widget>|g' myapp/config.xml

      - name: Copy index.html & Bundle Offline PDF.js Library
        run: |
          rm -rf myapp/www/*
          cp index.html myapp/www/
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js -o myapp/www/pdf.min.js
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js -o myapp/www/pdf.worker.min.js

      - name: Build Android APK (Debug)
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMed-PRO-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
