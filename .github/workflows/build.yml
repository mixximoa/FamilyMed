name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure Android SDK 34 & 35 are installed
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.family.medcard FamilyMed
          cd myapp
          cordova platform add android

      - name: Inject Native Chunked File & Video Stream Bridge into MainActivity.java
        run: |
          cat << 'EOF' > myapp/platforms/android/app/src/main/java/com/family/medcard/MainActivity.java
          package com.family.medcard;

          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.WebView;
          import android.webkit.JavascriptInterface;
          import android.content.Intent;
          import android.content.ClipData;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.StrictMode;
          import android.provider.MediaStore;
          import java.io.OutputStream;
          import java.io.InputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import org.apache.cordova.*;

          public class MainActivity extends CordovaActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  StrictMode.VmPolicy.Builder builder = new StrictMode.VmPolicy.Builder();
                  StrictMode.setVmPolicy(builder.build());

                  Bundle extras = getIntent().getExtras();
                  if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {
                      moveTaskToBack(true);
                  }
                  loadUrl(launchUrl);
                  try {
                      WebView webView = (WebView) this.appView.getView();
                      webView.getSettings().setJavaScriptEnabled(true);
                      webView.getSettings().setAllowFileAccess(true);
                      webView.getSettings().setAllowContentAccess(true);
                      webView.getSettings().setAllowFileAccessFromFileURLs(true);
                      webView.getSettings().setAllowUniversalAccessFromFileURLs(true);
                      webView.getSettings().setDomStorageEnabled(true);
                      webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidNative");
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public class WebAppInterface {
                  private File getMediaStorageDir() {
                      File dir = new File(getExternalFilesDir(null), "MedMedia");
                      if (!dir.exists()) dir.mkdirs();
                      return dir;
                  }

                  private byte[] decodeBase64Chunk(String base64Data) {
                      String pure = base64Data;
                      int comma = base64Data.indexOf(',');
                      if (comma != -1) {
                          pure = base64Data.substring(comma + 1);
                      }
                      return Base64.decode(pure, Base64.DEFAULT);
                  }

                  // 1. CHUNKED UPLOAD FOR LARGE VIDEOS & FILES (250MB+ support without OOM)
                  @JavascriptInterface
                  public String writeMediaChunk(String storedFileName, String base64Chunk, boolean append) {
                      try {
                          File outFile = new File(getMediaStorageDir(), storedFileName);
                          FileOutputStream fos = new FileOutputStream(outFile, append);
                          byte[] bytes = decodeBase64Chunk(base64Chunk);
                          fos.write(bytes);
                          fos.flush();
                          fos.close();
                          return Uri.fromFile(outFile).toString();
                      } catch (Throwable t) {
                          return "ERR:" + t.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String getNativeMediaUri(String storedFileName) {
                      File f = new File(getMediaStorageDir(), storedFileName);
                      if (f.exists() && f.length() > 0) {
                          return Uri.fromFile(f).toString();
                      }
                      return "";
                  }

                  // Copy internal stored file to public Downloads and return Content Uri
                  private Uri copyFileToPublicDownloads(File sourceFile, String displayFileName, String mimeType) throws Exception {
                      String finalName = displayFileName;
                      int dot = displayFileName.lastIndexOf('.');
                      String base = (dot != -1) ? displayFileName.substring(0, dot) : displayFileName;
                      String ext = (dot != -1) ? displayFileName.substring(dot) : "";
                      // Add timestamp suffix to avoid MediaStore duplicate name conflicts
                      finalName = base + "_" + (System.currentTimeMillis() % 100000) + ext;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.Downloads.DISPLAY_NAME, finalName);
                          values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                          values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          values.put(MediaStore.Downloads.IS_PENDING, 1);

                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              OutputStream out = getContentResolver().openOutputStream(uri);
                              FileInputStream in = new FileInputStream(sourceFile);
                              byte[] buf = new byte[65536];
                              int len;
                              while ((len = in.read(buf)) > 0) {
                                  out.write(buf, 0, len);
                              }
                              in.close();
                              out.flush();
                              out.close();

                              values.clear();
                              values.put(MediaStore.Downloads.IS_PENDING, 0);
                              getContentResolver().update(uri, values, null, null);
                              return uri;
                          }
                      }

                      File dlDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dlDir.exists()) dlDir.mkdirs();
                      File dest = new File(dlDir, finalName);
                      FileInputStream in = new FileInputStream(sourceFile);
                      FileOutputStream out = new FileOutputStream(dest);
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) > 0) {
                          out.write(buf, 0, len);
                      }
                      in.close();
                      out.flush();
                      out.close();
                      return Uri.fromFile(dest);
                  }

                  @JavascriptInterface
                  public String executeStoredFileAction(String storedFileName, String displayFileName, String mimeType, String actionType, String title) {
                      try {
                          File src = new File(getMediaStorageDir(), storedFileName);
                          if (!src.exists() || src.length() == 0) {
                              return "ERR:Файл порожній або не знайдений. Прикріпіть його заново.";
                          }
                          Uri publicUri = copyFileToPublicDownloads(src, displayFileName, mimeType);
                          if (actionType.equals("download")) {
                              return "OK";
                          } else if (actionType.equals("open")) {
                              Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                              viewIntent.setDataAndType(publicUri, mimeType);
                              viewIntent.setClipData(ClipData.newRawUri("", publicUri));
                              viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                              Intent chooser = Intent.createChooser(viewIntent, "Відкрити файл у додатку");
                              chooser.setClipData(ClipData.newRawUri("", publicUri));
                              chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(chooser);
                              return "OK";
                          } else if (actionType.equals("share")) {
                              Intent shareIntent = new Intent(Intent.ACTION_SEND);
                              shareIntent.setType(mimeType);
                              shareIntent.putExtra(Intent.EXTRA_STREAM, publicUri);
                              shareIntent.putExtra(Intent.EXTRA_SUBJECT, title);
                              shareIntent.putExtra(Intent.EXTRA_TEXT, title);
                              shareIntent.setClipData(ClipData.newRawUri("", publicUri));
                              shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                              Intent chooser = Intent.createChooser(shareIntent, "Поділитися файлом");
                              chooser.setClipData(ClipData.newRawUri("", publicUri));
                              chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(chooser);
                              return "OK";
                          }
                          return "OK";
                      } catch (Throwable t) {
                          return "ERR:" + t.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String saveBackupToPhone(String fileName, String content) {
                      try {
                          File tmp = new File(getMediaStorageDir(), "temp_backup.json");
                          FileOutputStream fos = new FileOutputStream(tmp, false);
                          fos.write(content.getBytes(StandardCharsets.UTF_8));
                          fos.flush();
                          fos.close();
                          copyFileToPublicDownloads(tmp, fileName, "application/json");
                          return "OK";
                      } catch (Throwable e) {
                          return "ERR:" + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String shareBackupFile(String fileName, String content) {
                      try {
                          File tmp = new File(getMediaStorageDir(), "temp_backup.json");
                          FileOutputStream fos = new FileOutputStream(tmp, false);
                          fos.write(content.getBytes(StandardCharsets.UTF_8));
                          fos.flush();
                          fos.close();
                          Uri uri = copyFileToPublicDownloads(tmp, fileName, "application/json");
                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                          shareIntent.setType("application/json");
                          shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                          shareIntent.putExtra(Intent.EXTRA_SUBJECT, fileName);
                          shareIntent.putExtra(Intent.EXTRA_TEXT, "Резервна копія Сімейна Медкартка PRO (" + fileName + ")");
                          shareIntent.setClipData(ClipData.newRawUri("", uri));
                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          Intent chooser = Intent.createChooser(shareIntent, "Зберегти на Google Диск або переслати");
                          chooser.setClipData(ClipData.newRawUri("", uri));
                          chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                          return "OK";
                      } catch (Throwable e) {
                          return "ERR:" + e.getMessage();
                      }
                  }
              }
          }
          EOF

      - name: Create Medical App Icon & Set App Name
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -size 512x512 xc:"#0284c7" -fill "#ffffff" -draw "rectangle 206,96 306,416" -draw "rectangle 96,206 416,306" myapp/icon.png
          sed -i 's|<name>FamilyMed</name>|<name>Медкартка PRO</name>|g' myapp/config.xml
          sed -i 's|</widget>|  <icon src="icon.png" />\n</widget>|g' myapp/config.xml

      - name: Copy index.html
        run: |
          rm -rf myapp/www/*
          cp index.html myapp/www/

      - name: Build Android APK (Debug)
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMed-PRO-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
