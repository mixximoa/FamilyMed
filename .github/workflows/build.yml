name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install Android SDK Command-Line Tools & Platform Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Cordova Project & Add Plugins
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          cordova create myapp com.family.medcard FamilyMed
          cd myapp
          cordova platform add android --nosave
          cordova plugin add cordova-plugin-file --nosave
          cordova plugin add cordova-plugin-x-socialsharing --nosave

      - name: Generate Medical Icon & Set Ukrainian App Name
        run: |
          python3 -c '
          import struct, zlib
          def make_icon(filename, w=512, h=512):
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      dx = max(0, 90 - x, x - (w - 1 - 90))
                      dy = max(0, 90 - y, y - (h - 1 - 90))
                      if dx*dx + dy*dy > 90*90:
                          raw.extend((0, 0, 0, 0))
                          continue
                      in_v = (206 <= x <= 306) and (106 <= y <= 406)
                      in_h = (106 <= x <= 406) and (206 <= y <= 306)
                      if in_v or in_h:
                          raw.extend((255, 255, 255, 255))
                      else:
                          r = int(2 + (13 - 2) * (y / h))
                          g = int(132 + (148 - 132) * (y / h))
                          b = int(199 + (136 - 199) * (y / h))
                          raw.extend((r, g, b, 255))
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
              with open(filename, "wb") as f:
                  f.write(png)
          make_icon("myapp/icon.png")
          '
          if [ -f "icon.png" ]; then
            cp icon.png myapp/icon.png
          fi
          python3 -c '
          with open("myapp/config.xml", "r", encoding="utf-8") as f:
              xml = f.read()
          xml = xml.replace("<name>FamilyMed</name>", "<name>Сімейна Медкартка</name>")
          custom_tags = """  <icon src="icon.png" />
              <preference name="AndroidPersistentFileLocation" value="Compatibility" />
          </widget>"""
          xml = xml.replace("</widget>", custom_tags)
          with open("myapp/config.xml", "w", encoding="utf-8") as f:
              f.write(xml)
          '

      - name: Copy web app files
        run: |
          rm -rf myapp/www/*
          cp index.html myapp/www/

      - name: Build Android APK (Debug)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          cd myapp
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMed-PRO-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
