name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure Android SDK 34 & 35 are installed
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.family.medcard FamilyMed
          cd myapp
          cordova platform add android

      - name: Inject Native Android Backup & Share Bridge into MainActivity.java
        run: |
          cat << 'EOF' > myapp/platforms/android/app/src/main/java/com/family/medcard/MainActivity.java
          package com.family.medcard;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import org.apache.cordova.*;

          public class MainActivity extends CordovaActivity {
              private String pendingContent = "";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Bundle extras = getIntent().getExtras();
                  if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {
                      moveTaskToBack(true);
                  }
                  loadUrl(launchUrl);
                  try {
                      if (this.appView != null && this.appView.getView() instanceof WebView) {
                          WebView wv = (WebView) this.appView.getView();
                          wv.getSettings().setJavaScriptEnabled(true);
                          wv.addJavascriptInterface(new WebAppBridge(), "AndroidNative");
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public class WebAppBridge {
                  @JavascriptInterface
                  public String saveToDownloads(final String content, final String fileName) {
                      try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                              values.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                              values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  OutputStream os = getContentResolver().openOutputStream(uri);
                                  if (os != null) {
                                      os.write(content.getBytes(StandardCharsets.UTF_8));
                                      os.flush();
                                      os.close();
                                      return "OK";
                                  }
                              }
                          }
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  openCreateDocumentPicker(content, fileName);
                              }
                          });
                          return "PICKER";
                      } catch (Exception e) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  openCreateDocumentPicker(content, fileName);
                              }
                          });
                          return "PICKER";
                      }
                  }

                  @JavascriptInterface
                  public void saveWithSystemPicker(final String content, final String fileName) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              openCreateDocumentPicker(content, fileName);
                          }
                      });
                  }

                  @JavascriptInterface
                  public String shareBackupFile(final String content, final String fileName) {
                      try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                              values.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                              values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              final Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  OutputStream os = getContentResolver().openOutputStream(uri);
                                  if (os != null) {
                                      os.write(content.getBytes(StandardCharsets.UTF_8));
                                      os.flush();
                                      os.close();
                                  }
                                  runOnUiThread(new Runnable() {
                                      @Override
                                      public void run() {
                                          Intent shareIntent = new Intent(Intent.ACTION_SEND);
                                          shareIntent.setType("application/json");
                                          shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                                          shareIntent.putExtra(Intent.EXTRA_SUBJECT, fileName);
                                          shareIntent.putExtra(Intent.EXTRA_TEXT, "Резервна копія Сімейна Медкартка PRO");
                                          shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                          startActivity(Intent.createChooser(shareIntent, "Зберегти на Google Диск або переслати"));
                                      }
                                  });
                                  return "OK";
                              }
                          }
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  openCreateDocumentPicker(content, fileName);
                              }
                          });
                          return "PICKER";
                      } catch (Exception e) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  openCreateDocumentPicker(content, fileName);
                              }
                          });
                          return "PICKER";
                      }
                  }
              }

              private void openCreateDocumentPicker(String content, String fileName) {
                  pendingContent = content;
                  String mime = fileName.endsWith(".html") ? "text/html" : (fileName.endsWith(".csv") ? "text/csv" : "application/json");
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType(mime);
                  intent.putExtra(Intent.EXTRA_TITLE, fileName);
                  startActivityForResult(intent, 9901);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 9901 && resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {
                      try {
                          OutputStream os = getContentResolver().openOutputStream(data.getData());
                          if (os != null && pendingContent != null) {
                              os.write(pendingContent.getBytes(StandardCharsets.UTF_8));
                              os.flush();
                              os.close();
                          }
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  if (appView != null && appView.getView() instanceof WebView) {
                                      ((WebView) appView.getView()).evaluateJavascript("if(window.onNativeBackupSaved) window.onNativeBackupSaved();", null);
                                  }
                              }
                          });
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }
          }
          EOF

      - name: Create Medical App Icon & Set App Name
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -size 512x512 xc:"#0284c7" -fill "#ffffff" -draw "rectangle 206,96 306,416" -draw "rectangle 96,206 416,306" myapp/icon.png
          sed -i 's|<name>FamilyMed</name>|<name>Медкартка PRO</name>|g' myapp/config.xml
          sed -i 's|</widget>|  <icon src="icon.png" />\n</widget>|g' myapp/config.xml

      - name: Copy index.html
        run: |
          rm -rf myapp/www/*
          cp index.html myapp/www/

      - name: Build Android APK (Debug)
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMed-PRO-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
